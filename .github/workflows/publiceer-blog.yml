# Blog automatisch publiceren.
#
# Slaat iemand in het dashboard (Blog) een artikel op, dan komt er een commit
# op main onder blog/_bron/. Deze workflow bouwt daarna de blog en zet alleen
# de blogpagina's en de sitemap op de server. De rest van de site blijft een
# handmatige uitrol.
#
# Veiligheid:
# - draait alleen op main, en alleen als er iets onder blog/_bron/ wijzigt
# - de serversleutel staat in de omgeving "productie", die alleen main toelaat
# - die sleutel kan op de server alleen bestanden schrijven binnen de map van
#   deze site (rrsync -wo), geen shell, geen andere sites
# - de serveridentiteit is vastgepind (known_hosts), geen "accepteer alles"
# - bron met scripts of ingesloten inhoud wordt geweigerd vóór het bouwen
# - de bouw mag alleen blog/ en sitemap.xml wijzigen, anders stopt hij
#
# Eenmalig inrichten: scripts/zet-blog-publicatie-op.sh (vanaf de Mac van Elio).
name: Blog publiceren

on:
  push:
    branches: [main]
    paths: ['blog/_bron/**']
  workflow_dispatch:

concurrency:
  group: blog-publiceren
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publiceer:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: productie
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main            # altijd de nieuwste stand, ook bij twee opslagen kort na elkaar

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Bouwgereedschap
        run: pip install --quiet markdown==3.10.2

      - name: Bron controleren
        run: python3 scripts/controleer_blog_bron.py

      - name: Blog bouwen
        run: python3 build_blog.py

      - name: Alleen blog en sitemap mogen gewijzigd zijn
        run: |
          buiten=$(git status --porcelain | awk '{print $2}' | grep -vE '^(blog/|sitemap\.xml$)' || true)
          if [ -n "$buiten" ]; then
            echo "::error::De bouw wijzigde bestanden buiten blog/ en sitemap.xml:"; echo "$buiten"; exit 1
          fi
          test -s blog/index.html
          test "$(ls blog/*.html | wc -l)" -ge 2

      - name: Gebouwde pagina's vastleggen
        env:
          TAK: main
        run: |
          git config user.name "blog-publicatie"
          git config user.email "blog-publicatie@users.noreply.github.com"
          git add blog sitemap.xml
          if git diff --cached --quiet; then
            echo "Niets gewijzigd in de gebouwde pagina's."
          else
            git commit -q -m "blog: gebouwde pagina's bijgewerkt [skip ci]"
            git push -q origin "HEAD:$TAK"
          fi

      - name: Naar de server
        env:
          SLEUTEL: ${{ secrets.BLOG_DEPLOY_KEY }}
          BEKENDE_HOSTS: ${{ secrets.BLOG_KNOWN_HOSTS }}
          DOEL: ${{ vars.BLOG_DEPLOY_DOEL }}      # gebruiker@host
        run: |
          set -euo pipefail
          test -n "$SLEUTEL" && test -n "$BEKENDE_HOSTS" && test -n "$DOEL" || { echo "::error::Publicatie is nog niet ingericht (zie scripts/zet-blog-publicatie-op.sh)."; exit 1; }
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SLEUTEL" > ~/.ssh/blog_key && chmod 600 ~/.ssh/blog_key
          printf '%s\n' "$BEKENDE_HOSTS" > ~/.ssh/known_hosts
          SSH="ssh -i $HOME/.ssh/blog_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts"
          # De sleutel is op de server begrensd tot de sitemap; paden zijn daar relatief aan.
          rsync -rltz --delete --exclude '_bron/' -e "$SSH" blog/ "$DOEL:blog/"
          rsync -ltz -e "$SSH" sitemap.xml "$DOEL:sitemap.xml"
          if [ -d Assets/blog ]; then rsync -rltz -e "$SSH" Assets/blog/ "$DOEL:Assets/blog/"; fi
          rm -f ~/.ssh/blog_key

      - name: Staat het online?
        run: |
          sleep 3
          # -L: /blog verwijst door naar /blog/ (301); zonder volgen keurde deze stap een geslaagde publicatie af.
          code=$(curl -sL -o /tmp/blog.html -m 20 -w '%{http_code}' https://www.conti-nu.nl/blog/)
          test "$code" = "200" || { echo "::error::conti-nu.nl/blog antwoordt met $code"; exit 1; }
          nieuwste=$(python3 -c "import json;print(json.load(open('blog/artikelen.json'))['articles'][0].get('slug',''))" 2>/dev/null || true)
          if [ -n "$nieuwste" ] && ! grep -q "$nieuwste" /tmp/blog.html; then
            echo "::warning::Het nieuwste artikel ($nieuwste) staat nog niet in het overzicht."
          fi
